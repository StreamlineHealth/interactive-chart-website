<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Radiology Workflow Dashboard</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <h1>Radiology Workflow Performance Tracker</h1>
    <p>Select an imaging procedure and location to view workflow metrics and overall performance.</p>

    <div class="controls">
        <label for="procedure">Procedure:
            <select id="procedure"></select>
        </label>
        <label for="location">Location:
            <select id="location"></select>
        </label>
    </div>

    <div class="chart-container">
        <canvas id="workflowChart"></canvas>
    </div>

    <div class="gauge-container">
        <div class="gauge">
            <div id="gauge-fill"></div>
            <span id="gauge-text">0%</span>
        </div>
        <p>Overall Performance</p>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="script.js"></script>
</body>
</html>
